[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution AND the import package are both `awnode` (`pip install awnode`,
# `import awnode`); the console scripts are `awnode` / `awnode-mcp` (see
# [project.scripts]). The old `aithernode` distribution name is kept resolving by
# the redirect stub in `packaging/aithernode-stub/`.
name = "awnode"
version = "0.3.5"
description = "awnode — lightweight local gateway for AitherOS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aitherium", email = "hello@aitherium.com" }]
keywords = ["ai", "agents", "aitheros", "mcp", "gateway"]

dependencies = [
    "awdk>=1.3.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # mcp 1.x AND 2.x are both supported (mcp_server._build_server picks the
    # API at import): 2.x moved the low-level handlers from the
    # @server.list_tools()/@server.call_tool() decorators to on_list_tools= /
    # on_call_tool= constructor kwargs. The old <2 pin broke `awnode mcp` the
    # moment a sibling aw brick (awrelay/awgraph/awdelphi need >=2) pulled
    # 2.2 into the same env (2026-10-14); widening to <3 instead of >=2 keeps
    # awdk[node] (still mcp<2) co-installable in one env.
    "mcp>=1.0.0,<3.0.0",
]

# No Repository/Documentation entry: Aitherium/awnode is a PRIVATE
# "collaborator surface" mirror (measured 2026-08-19 via `gh repo view`), so a
# public link would point strangers at a 404/login wall — worse than no link.
# awdk/awrelay/awgit/awgraph/aitherkvcache/awskills/AitherZero all
# aither-adk/awrelay/awgit/awgraph/aitherkvcache/aither-skills/AitherZero all
# have a real public source mirror and set all three fields; this package does
# not yet, and that is an open decision (flip the repo public to match its
# siblings, or accept PyPI-only distribution) — not something to fake here.
[project.urls]
Homepage = "https://aitherium.com"

[project.optional-dependencies]
sse = ["starlette>=0.27.0"]
all = ["awnode[sse]"]
# The suite does not run without these. tests/test_custom_backend.py is async, and with no
# plugin pytest reports "async def functions are not natively supported" -- 3 failed, 83 passed,
# for anyone who clones this and runs pytest, not just for CI. Same shape as awgraph's.
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

[project.scripts]
awnode = "awnode.cli:main"
awnode-mcp = "awnode.mcp_server:main"

# The component manifests this package ships (awnode/components/*.yaml), found by
# awdk's addon loader on ANY machine awnode is installed on -- the same contract
# every pip-installed aw* brick uses. Before this, nine of them were a hardcoded
# list inside awnode that no other host could see.
[project.entry-points."aither.components"]
awnode = "awnode.components:manifest_dir"

[tool.hatch.build.targets.wheel]
packages = ["awnode"]

[tool.pytest.ini_options]
# auto: the async tests carry no @pytest.mark.asyncio, so without this the plugin is installed
# and still drives nothing.
asyncio_mode = "auto"
testpaths = ["tests"]
